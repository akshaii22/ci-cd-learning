name: Node.js CI

on:
  push:
    branches:
        - main
        - "feature/**"
  pull_request:
    branches: 
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
           TEXT_MESSAGE: $ {{secrets.TEXT_MESSAGE}}
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: test-report
         path: junit.xml 

      